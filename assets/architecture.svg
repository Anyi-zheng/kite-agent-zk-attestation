<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1100" height="420" fill="#090d16" rx="16"/>

  <!-- Column 1: Off-Chain Agent Execution -->
  <g transform="translate(40, 40)">
    <rect width="280" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="44" rx="12" fill="#1e293b"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Autonomous Agent</text>
    
    <rect x="20" y="65" width="240" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="88" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Agent Prompt &amp; Memory</text>
    <text x="120" y="104" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Multi-turn LLM reasoning</text>

    <rect x="20" y="130" width="240" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="153" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">State Root Digest (H_s)</text>
    <text x="120" y="169" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Keccak-256 Merkle root</text>

    <rect x="20" y="195" width="240" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="120" y="220" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">x402 Micropayment</text>
    <text x="120" y="240" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">EIP-712 TransferAuth</text>

    <rect x="20" y="270" width="240" height="48" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="120" y="298" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">SNARK Execution Trace</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <g transform="translate(330, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#neonBorder)" stroke-width="3" stroke-dasharray="5,5"/>
    <polygon points="65,0 55,-6 55,6" fill="#818cf8"/>
    <text x="30" y="-12" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle">ZK Witness</text>
  </g>

  <!-- Column 2: Proof Relayer & Orchestrator -->
  <g transform="translate(410, 40)">
    <rect width="280" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="44" rx="12" fill="#1e293b"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#818cf8" text-anchor="middle">2. ZK Attestation Relay</text>

    <rect x="20" y="65" width="240" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="92" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Zod Runtime Validator</text>
    <text x="120" y="112" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Bytes32 format &amp; bounds check</text>

    <rect x="20" y="150" width="240" height="70" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="120" y="177" font-family="monospace" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Epoch Monotonic Sequencer</text>
    <text x="120" y="197" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Prevents rollback / replay</text>

    <rect x="20" y="235" width="240" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="262" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Public Inputs Vector (4)</text>
    <text x="120" y="282" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">[agentId, state, epoch, receipt]</text>
  </g>

  <!-- Flow 2 -> 3 Arrow -->
  <g transform="translate(700, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#neonBorder)" stroke-width="3" stroke-dasharray="5,5"/>
    <polygon points="65,0 55,-6 55,6" fill="#c084fc"/>
    <text x="30" y="-12" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="middle">Submit Tx</text>
  </g>

  <!-- Column 3: Kite Chain Settlement -->
  <g transform="translate(780, 40)">
    <rect width="280" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="44" rx="12" fill="#1e293b"/>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#c084fc" text-anchor="middle">3. Kite Chain (EIP-155: 2368)</text>

    <rect x="20" y="65" width="240" height="70" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
    <text x="120" y="92" font-family="monospace" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">IKiteVerifier Contract</text>
    <text x="120" y="112" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Groth16 pairing &amp; curve check</text>

    <rect x="20" y="150" width="240" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="177" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Attestation Registry Vault</text>
    <text x="120" y="197" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Immutable storage mapping</text>

    <rect x="20" y="235" width="240" height="70" rx="8" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1.2"/>
    <text x="120" y="262" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">AttestationAnchored Event</text>
    <text x="120" y="282" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Indexed emission for indexers</text>
  </g>
</svg>
